name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt vermin
      - name: Unit tests
        run: python -m unittest discover -s test -p "test_*.py"
      - name: Scripts must stay compatible with Python 3.7
        run: vermin --target=3.7- --no-tips --violations scripts/investec_card.py scripts/scan_for_secrets.py
      - name: No secrets or personal identifiers
        run: python scripts/scan_for_secrets.py
